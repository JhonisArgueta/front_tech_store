<nav class="fixed top-0 left-0 w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- LOGO -->
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
        <span class="text-2xl">⚡</span>
        <span class="text-xl font-extrabold text-white tracking-wider">
          Tech<span class="text-indigo-500">Store</span>
        </span>
      </div>

      <!-- ENLACES DE NAVEGACIÓN (DESKTOP) -->
      <ul class="hidden md:flex items-center gap-6">
        <li>
          <a routerLink="/" 
             routerLinkActive="text-indigo-400 font-semibold" 
             [routerLinkActiveOptions]="{exact: true}"
             class="text-slate-300 hover:text-white transition-colors duration-200 text-sm">
            Inicio
          </a>
        </li>
        


        <li>
          <a routerLink="/nosotros" 
             routerLinkActive="text-indigo-400 font-semibold" 
             class="text-slate-300 hover:text-white transition-colors duration-200 text-sm">
            Nosotros
          </a>
        </li>
      </ul>

      <!-- BOTONES DERECHA: CARRITO Y LOGIN -->
      <div class="hidden md:flex items-center gap-4">
        
        <!-- Botón Carrito con badge -->
        <button class="relative p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition-all duration-200 border border-slate-700 focus:outline-none flex items-center gap-2 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707h10.586c.912 0 1.58-.81 1.34-1.688L18.707 13M7 13M10 21a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
          </svg>
          <span class="text-sm font-medium">Carrito</span>
          @if (cartCount > 0) {
            <span class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-[10px] font-bold h-5 w-5 rounded-full flex items-center justify-center border-2 border-slate-900">
              {{ cartCount }}
            </span>
          }
        </button>

        <!-- Botón Login -->
        <a routerLink="/auth" 
           class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-md shadow-indigo-600/20 transition-all duration-200 cursor-pointer">
          Login
        </a>
      </div>

      <!-- BOTÓN MENÚ MÓVIL (HAMBURGUESA) -->
      <div class="md:hidden flex items-center gap-2">
        <button (click)="toggleMenu()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (!isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- MENÚ DESPLEGABLE EN MÓVIL -->
  @if (isMenuOpen) {
    <div class="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-2">
      <a routerLink="/" (click)="toggleMenu()" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white text-base font-medium">Inicio</a>
      <a routerLink="/contador" (click)="toggleMenu()" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white text-base font-medium">Contador</a>
      <a routerLink="/nosotros" (click)="toggleMenu()" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white text-base font-medium">Nosotros</a>
      <a routerLink="/productos" (click)="toggleMenu()" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white text-base font-medium">Productos</a>
      
      <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
        <button class="flex items-center gap-2 text-indigo-400 font-medium text-sm">
          🛒 Carrito ({{ cartCount }})
        </button>
        <a routerLink="/auth" (click)="toggleMenu()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold">
          Login
        </a>
      </div>
    </div>
  }
</nav>
